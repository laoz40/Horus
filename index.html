<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <!-- Google font + main stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- App header with title and navigation buttons -->
    <header>
        <h1>Workout Tracker</h1>
        <nav>
            <button data-page="workout-dashboard-page">Workout</button>
            <button data-page="history-page">History</button>
            <button data-page="progress-page">Progress</button>
            <button data-page="settings-page">Settings</button>
        </nav>
    </header>

    <!-- Main content area. Only one .page is shown at a time by JS -->
    <main>
        <div class="workout-dashboard-container">
        <!-- Home/Dashboard page -->
        <section id="workout-dashboard-page" class="page active">
            <button id="start-workout-btn">Start Workout</button>
            <button id="new-preset-btn">New Preset</button>
            <!-- Shows the most recent saved workout -->
            <div id="last-workout-summary">
                <h2>Last Workout</h2>
                <p>No workout data yet.</p>
            </div>
        </section>

        <!-- New Workout page: name/date form + list of exercises -->
        <section id="new-workout-page" class="page">
            <!-- Workout details card -->
            <form id="new-workout-form" class="card">
                <div class="workout-text-container">
                    <input type="text" id="workout-name" required>
                    <div id="workout-date" class="readout" aria-readonly="true"></div>
                </div>
                <section id="add-exercises-container">
                    <div id="add-exercise-forms"><!-- Inline exercise forms --></div>
                    <button id="add-exercise-btn" type="button">Add Exercise</button>
                    <datalist id="exercise-name-list"></datalist>
                </section>
            </form>

            <!-- Exercises card with inline forms populated by JS -->


            <!-- Main call-to-action to save the current workout -->
            <div class="actions">
                <button id="finish-workout-btn" type="button">Finish Workout</button>
            </div>
        </section>

        <!-- History page: JS fills this with saved workouts -->
        <section id="history-page" class="page">
            <h2>Workout History</h2>
            <!-- Content for Workout History Page will go here -->
        </section>

        <!-- Progress page: placeholder for charts/stats -->
        <section id="progress-page" class="page">
            <h2>Exercise Progress</h2>
            <!-- Content for Exercise Progress Page will go here -->
        </section>

        <!-- Presets page: placeholder for exercise templates -->
        <section id="presets-page" class="page">
            <h2>Presets</h2>
            <!-- Content for Presets Page will go here -->
        </section>

        <!-- Settings/data page: export/import and other options -->
        <section id="settings-page" class="page">
            <h2>Settings / Data</h2>
            <!-- Content for Settings / Data Page will go here -->
            <button id="open-presets-from-settings" type="button" class="secondary">Presets</button>
        </section>
        </div>
    </main>

    <!-- Main application script -->
    <script src="script.js"></script>
</body>
</html>
