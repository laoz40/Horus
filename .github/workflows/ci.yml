name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - production
  push:
    branches:
      - production

permissions:
  contents: read

# One run per branch/PR ref. New PR pushes cancel the previous run.
# Production pushes queue instead of canceling, so a deploy is not killed mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ephemeral Postgres per PR. Push to production keeps using Production DATABASE_URL.
  # Requires repo secret NEON_API_KEY and variable NEON_PROJECT_ID (Neon GitHub integration sets both).
  database:
    name: Database
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Set branch expiration
        if: github.event_name == 'pull_request'
        run: echo "EXPIRES_AT=$(date -u --date '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch
        if: github.event_name == 'pull_request'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}
          parent_branch: production
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Re-sync from production on every new push so the branch picks up merged migrations.
      - name: Reset Neon branch to production
        if: github.event_name == 'pull_request' && steps.neon.outputs.created == 'false'
        id: neon-reset
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      # Job outputs strip values that look like secrets. Pass the URL via artifact instead.
      - name: Save database URL
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ steps.neon-reset.outputs.db_url || steps.neon.outputs.db_url }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s' "$NEON_DATABASE_URL" > database-url.txt
          else
            printf '%s' "$PROD_DATABASE_URL" > database-url.txt
          fi

      - name: Upload database URL
        uses: actions/upload-artifact@v5
        with:
          name: database-url
          path: database-url.txt
          retention-days: 1

  neon-cleanup:
    name: Delete Neon PR branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  quality:
    name: Lint & typecheck
    needs: database
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download database URL
        uses: actions/download-artifact@v5
        with:
          name: database-url

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=$(cat database-url.txt)" >> "$GITHUB_ENV"

      - name: Apply migrations
        if: github.event_name == 'pull_request'
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          # Forked Neon branches copy production schema but may lack _prisma_migrations.
          pnpm exec prisma migrate resolve --applied 0_init || true
          pnpm db:migrate

      - name: Generate Prisma client with typed SQL
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check for dead code (Fallow)
        run: pnpm fallow:check-dead-code

      - name: Check for duplication (Fallow)
        run: pnpm fallow:check-dupes

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - database
      - quality
    if: github.event.action != 'closed'
    environment: Production
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      PERSONAL_EMAIL: ${{ vars.PERSONAL_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download database URL
        uses: actions/download-artifact@v5
        with:
          name: database-url

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=$(cat database-url.txt)" >> "$GITHUB_ENV"

      - name: Generate Prisma client with typed SQL
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          pnpm db:generate

      - name: Build
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          pnpm build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs:
      - database
      - quality
    if: github.event.action != 'closed'
    environment: Production
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download database URL
        uses: actions/download-artifact@v5
        with:
          name: database-url

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=$(cat database-url.txt)" >> "$GITHUB_ENV"

      - name: Generate Prisma client with typed SQL
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          pnpm db:generate

      - name: Write .env.local for tests
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          PERSONAL_EMAIL: ${{ vars.PERSONAL_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "Missing Production environment values. Client IDs, emails, and URLs are variables (vars), not secrets."
            exit 1
          fi
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_URL_UNPOOLED=%s\n' "${DATABASE_URL//-pooler/}"
            printf 'SITE_URL=http://localhost:8000\n'
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'RESEND_FROM_EMAIL=%s\n' "$RESEND_FROM_EMAIL"
            printf 'PERSONAL_EMAIL=%s\n' "$PERSONAL_EMAIL"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID"
            printf 'GITHUB_CLIENT_SECRET=%s\n' "$GITHUB_CLIENT_SECRET"
            printf 'UPSTASH_REDIS_REST_URL=%s\n' "$UPSTASH_REDIS_REST_URL"
            printf 'UPSTASH_REDIS_REST_TOKEN=%s\n' "$UPSTASH_REDIS_REST_TOKEN"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
          } > .env.local

      - name: Run Playwright tests
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy production
    needs:
      - build
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client with typed SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          pnpm db:generate

      - name: Pull Vercel production env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # vercel pull writes [SENSITIVE] for dashboard secrets. Overlay GitHub
      # Production values so the build does not use those placeholders.
      - name: Build for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          PERSONAL_EMAIL: ${{ vars.PERSONAL_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          export DATABASE_URL_UNPOOLED="${DATABASE_URL//-pooler/}"
          pnpm dlx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
